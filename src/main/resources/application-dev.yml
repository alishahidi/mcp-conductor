spring:
  config:
    activate:
      on-profile: dev

# Security Configuration
security:
  enabled: false  # Disable security for development
  command:
    strict-mode: false  # Allow all commands in dev mode - validation still applies
    allowed:
      # Basic system commands
      - ls
      - cat
      - echo
      - pwd
      - whoami
      - uname
      - date
      - touch
      - printf
      - tee
      - sed
      - awk
      - cut
      - sort
      - uniq
      - wc
      - diff

      # Process management
      - ps
      - top
      - htop
      - kill
      - killall
      - pgrep
      - pkill

      # System info
      - df
      - du
      - free
      - uptime
      - netstat
      - ss
      - ip
      - ifconfig
      - hostname
      - lsblk
      - lsof
      - dmesg

      # Service management
      - systemctl
      - service
      - journalctl

      # File operations
      - chmod
      - chown
      - mkdir
      - rmdir
      - rm
      - cp
      - mv
      - ln
      - readlink
      - stat

      # File viewing/editing
      - tail
      - head
      - less
      - more
      - grep
      - egrep
      - fgrep
      - find
      - locate
      - which
      - whereis

      # Archiving
      - tar
      - gzip
      - gunzip
      - bzip2
      - bunzip2
      - zip
      - unzip
      - xz

      # Network
      - curl
      - wget
      - ping
      - traceroute
      - nslookup
      - dig
      - nc
      - netcat

      # Development tools
      - docker
      - git
      - npm
      - yarn
      - node
      - python
      - python3
      - pip
      - pip3
      - java
      - javac
      - mvn
      - gradle
      - make
      - gcc
      - g++

      # Package managers
      - apt
      - apt-get
      - aptitude
      - yum
      - dnf
      - pacman
      - zypper
      - brew

      # Web servers
      - nginx
      - apache2
      - httpd
      - pm2

      # Database clients
      - mysql
      - psql
      - mongo
      - redis-cli

      # Text editors (non-interactive mode)
      - nano
      - vi
      - vim
      - emacs

  path:
    allowed:
      # Empty list means allow all paths except blocked ones in dev mode
      # For production, specify explicit paths

    blocked:
      - /etc/passwd
      - /etc/shadow
      - /etc/sudoers
      - /etc/ssh/sshd_config
      - /proc/kcore
      - /dev/mem
      - /dev/kmem
      - /sys
      - /boot/grub

# Rate Limiting (relaxed for dev)
rate-limit:
  capacity: 1000
  refill-tokens: 100
  refill-duration-minutes: 1

# SSH Configuration (dev environment)
ssh:
  default:
    host: ${SSH_DEFAULT_HOST:localhost}
    username: ${SSH_DEFAULT_USERNAME:}
    port: ${SSH_DEFAULT_PORT:22}
    password: ${SSH_DEFAULT_PASSWORD:}
    private-key-path: ${SSH_PRIVATE_KEY_PATH:}
    passphrase: ${SSH_PASSPHRASE:}

  connection-pool:
    max-size: 10
    min-idle: 2
    max-wait-millis: 30000

# Docker Configuration
docker:
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  tls-verify: false
  api-version: ${DOCKER_API_VERSION:1.41}

# Logging
logging:
  level:
    root: INFO
    net.alishahidi.mcpconductor: DEBUG
    org.springframework.ai.mcp: DEBUG
    org.springframework.security: DEBUG

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
